name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intentlock_test
          POSTGRES_USER: intentlock
          POSTGRES_PASSWORD: intentlock_test_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "intentlock_redis_test_secret"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check app sdk tests

      - name: Type check with mypy
        run: mypy app

      - name: Security scan with bandit
        run: bandit -r app -ll

      - name: Static analysis with semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
          generate-token: true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg2://intentlock:intentlock_test_secret@localhost:5432/intentlock_test
          REDIS_URL: redis://:intentlock_redis_test_secret@localhost:6379/0
          REDIS_ENABLED: "true"
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
          APP_ENV: test
          DEBUG: "true"
        run: |
          pytest --cov=app --cov=sdk --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://intentlock:intentlock_test_secret@localhost:5432/intentlock_test
        run: |
          alembic check
          alembic current
