[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlock"
version = "4.0.0"
description = "Enterprise-grade dynamic proof-of-intent authorization gateway for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pyjwt>=2.9,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=4.5,<5.0",
    "cryptography>=43.0,<45.0",
    "PyYAML>=6.0,<7.0",
    "sqlglot>=25.0,<30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.7,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "DTZ", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "^tests/"
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing", "--cov-report=xml"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app", "sdk"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]
