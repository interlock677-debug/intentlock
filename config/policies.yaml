# IntentLock v4.0 Policy Configuration
#
# This file configures both the legacy text-risk PolicyEngine and the
# new CentralPolicyEngine.  All thresholds are explicitly configurable.

# Legacy text-risk configuration (used by PolicyEngine)
score_threshold: 0.5

blocked_patterns:
  - "drop table"
  - "truncate table"
  - "rm -rf"
  - "/bin/sh"
  - "powershell -enc"
  - "delete from users"
  - "update users set"

# Central policy engine configuration (used by CentralPolicyEngine)
policy_version: "1"
default_effect: allow

rules:
  - id: "deny-dangerous-tools"
    version: "1"
    effect: deny
    description: "Deny execution of dangerous tools"
    match:
      tool:
        - "execute_sql"
        - "shell"
        - "dangerous_command"
    priority: 100

  - id: "hitl-financial-transfers"
    version: "1"
    effect: require_hitl
    description: "Require human approval for financial transfer tools"
    match:
      tool: "transfer_funds"
    priority: 50

  - id: "allow-search-and-read"
    version: "1"
    effect: allow
    description: "Allow search and read tools for all agents"
    match:
      tool:
        - "search"
        - "read"
        - "list"
    priority: 10
